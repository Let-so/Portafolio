<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sofía Cardozo — AIDía</title>
<style>
  :root{
    --ink:#232322;
    --ink-soft:#8a8985;
    --veil:rgba(255,255,255,.34);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    /* fallback si no hay WebGL */
    background:#dcdbd7;
    font-family:"Helvetica Neue",Helvetica,"Inter",Arial,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- capa de textura ---------- */
  #plush{
    position:fixed;inset:0;width:100%;height:100%;
    display:block;z-index:0;
  }
  #plush + .veil{
    position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(58% 62% at 50% 46%, var(--veil) 0%, rgba(255,255,255,0) 72%);
  }

  /* ---------- hero ---------- */
  .hero{
    position:relative;z-index:2;
    min-height:100%;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:clamp(18px,3vw,46px);
    padding:clamp(24px,5vw,72px);
  }
  .side{display:flex;flex-direction:column}
  .side.left{align-items:flex-end;text-align:right}
  .side.right{align-items:flex-start;text-align:left}

  .eyebrow{
    font-size:clamp(11px,1.05vw,14px);
    letter-spacing:.01em;
    color:var(--ink-soft);
    margin:0 0 .35em;
  }
  .name{
    font-size:clamp(44px,8.4vw,112px);
    line-height:.92;
    font-weight:700;
    letter-spacing:-.035em;
    margin:0;
    text-transform:uppercase;
  }
  .meta{
    font-size:clamp(11px,1.05vw,14px);
    color:var(--ink-soft);
    margin:.9em 0 0;
  }
  .side.left .meta{visibility:hidden}      /* mantiene la simetría óptica */

  .portrait{
    width:clamp(190px,23vw,244px);
    aspect-ratio:6/7;
    border-radius:14px;
    overflow:hidden;
    background:#cfcecb;
    box-shadow:0 26px 60px -18px rgba(60,60,55,.45), 0 2px 8px rgba(60,60,55,.18);
  }
  .portrait img{width:100%;height:100%;object-fit:cover;display:block}

  @media (max-width:760px){
    .hero{grid-template-columns:1fr;justify-items:center;text-align:center;gap:22px}
    .side.left,.side.right{align-items:center;text-align:center}
    .side.left .meta{display:none}
    .name{font-size:clamp(40px,14vw,72px)}
    .side.left{order:2}.portrait{order:1}.side.right{order:3}
  }
</style>
</head>
<body>

<canvas id="plush" aria-hidden="true"></canvas>
<div class="veil"></div>

<main class="hero">
  <div class="side left">
    <p class="eyebrow">Founder &amp; CEO</p>
    <h1 class="name">Sofía</h1>
    <p class="meta">·</p>
  </div>

  <figure class="portrait">
    <!-- reemplazá el src por tu foto -->
    <img src="" alt="Sofía Cardozo">
  </figure>

  <div class="side right">
    <p class="eyebrow">AIDía</p>
    <h1 class="name">Cardozo</h1>
    <p class="meta">Córdoba, Argentina</p>
  </div>
</main>

<script>
(function(){
'use strict';

/* ================================================================
   TEXTURA PLUSH — una sola pasada de fragment shader.
   Mismo principio que la letra 3D: fibras con altura propia
   definida por ruido. Pero en vez de dibujar 40 mallas, acá se
   recorre el volumen del pelo por píxel, de la punta a la base,
   y se corta en la primera fibra que se cruza.
   ================================================================ */
const CONFIG = {
  density: 320,    // fibras a lo ancho de la pantalla (más = más fino)
  fur:     0.030,  // largo del pelo, como fracción del alto de pantalla
  depth:   0.30,   // contraste entre base y punta (0 = plano, 1 = dramático)
  swirl:   0.60,   // remolinos / mechones
  base:    [0.865, 0.860, 0.848],   // color del pelaje (RGB 0-1)
  lightFollowsCursor: true
};

const canvas = document.getElementById('plush');
const gl = canvas.getContext('webgl', {antialias:false, alpha:false, depth:false});
if(!gl){ canvas.style.display = 'none'; return; }   // se queda el fallback CSS

const VS = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

const FS = `
precision highp float;
uniform vec2  uRes;
uniform vec2  uLight;
uniform float uDensity, uFur, uDepth, uSwirl;
uniform vec3  uBase;

const int STEPS = 22;

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.0 - 2.0*f);
  return mix(mix(hash21(i),            hash21(i+vec2(1,0)), f.x),
             mix(hash21(i+vec2(0,1)),  hash21(i+vec2(1,1)), f.x), f.y);
}

/* altura de la fibra que ocupa este punto */
float fiberHeight(vec2 sp, out float seed){
  seed = hash21(floor(sp * uDensity));
  float clump = vnoise(sp * uDensity * 0.055);
  return clamp(0.22 + 0.95 * seed * mix(0.68, 1.18, clump), 0.0, 1.0);
}

void main(){
  vec2 uv = gl_FragCoord.xy / uRes.y;
  vec2 c  = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;

  // paralaje: el pelo se ve "de costado" a medida que te alejás del centro
  vec2 view = c * 0.62;

  // dirección de peinado: los mechones giran suavemente
  float a = vnoise(uv * 1.9) * 6.2831;
  vec2 drift = vec2(cos(a), sin(a)) * uSwirl;

  float hit = -1.0;
  float seed = 0.0, s = 0.0;

  for(int i = 0; i < STEPS; i++){
    float t = 1.0 - float(i) / float(STEPS - 1);   // 1 = punta, 0 = base
    vec2 sp = uv + (view + drift) * uFur * t;
    float h = fiberHeight(sp, s);
    if(h >= t){ hit = t; seed = s; break; }
  }

  float d = max(hit, 0.0);
  float shade = mix(1.0 - uDepth, 1.0, pow(d, 0.75));   // sombra hacia la raíz

  // luz de estudio suave
  vec2 lp = (uLight - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  float fall = 1.0 - 0.30 * clamp(length(c - lp) * 0.85, 0.0, 1.0);
  float rim  = 0.05 * pow(d, 3.0);

  vec3 col = uBase * shade * fall + rim;
  col += (seed - 0.5) * 0.022;                    // grano por fibra
  col *= 1.0 - 0.09 * pow(length(c) * 0.78, 2.2); // viñeta

  gl_FragColor = vec4(col, 1.0);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = n => gl.getUniformLocation(prog, n);
const uRes = U('uRes'), uLight = U('uLight');
gl.uniform1f(U('uDensity'), CONFIG.density);
gl.uniform1f(U('uFur'),     CONFIG.fur);
gl.uniform1f(U('uDepth'),   CONFIG.depth);
gl.uniform1f(U('uSwirl'),   CONFIG.swirl);
gl.uniform3f(U('uBase'),    CONFIG.base[0], CONFIG.base[1], CONFIG.base[2]);

let light = {x:0.42, y:0.62}, target = {x:0.42, y:0.62}, queued = false;

function draw(){
  queued = false;
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform2f(uLight, light.x, light.y);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function schedule(){ if(!queued){ queued = true; requestAnimationFrame(draw); } }

function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 1.75);
  canvas.width  = Math.round(innerWidth  * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  schedule();
}
addEventListener('resize', resize);
resize();

/* La luz sigue al cursor. Sin cursor no hay loop: el canvas
   se dibuja una sola vez y no consume nada. */
if(CONFIG.lightFollowsCursor && !matchMedia('(prefers-reduced-motion: reduce)').matches){
  let raf = 0;
  addEventListener('pointermove', e => {
    target.x = e.clientX / innerWidth;
    target.y = 1 - e.clientY / innerHeight;
    if(!raf) raf = requestAnimationFrame(function ease(){
      light.x += (target.x - light.x) * 0.07;
      light.y += (target.y - light.y) * 0.07;
      draw();
      raf = (Math.abs(target.x - light.x) + Math.abs(target.y - light.y) > 0.002)
        ? requestAnimationFrame(ease) : 0;
    });
  }, {passive:true});
}
})();
</script>
</body>
</html>
