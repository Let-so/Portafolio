services:
  - type: web
    name: sofia-cardozo-portfolio
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: NODE_VERSION
        value: "20"
    healthCheckPath: /
    routes:
      - path: /
        matchType: prefix

autoDeploy: true
